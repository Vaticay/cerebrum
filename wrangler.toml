# compatibility_date pins which workerd runtime behavior this project builds
# against — Cloudflare only ever changes defaults for workers that opt in by
# bumping this, so an old date isn't a security problem, just a missed-out-on
# problem. Bumped from 2025-07-18 (over a year stale) to a more current date;
# picked one comfortably in the past rather than "today" so it's a version of
# workerd that's actually had time to prove itself in production.
name = "cerebrum"
compatibility_date = "2025-10-01"
pages_build_output_dir = "dist"

[ai]
binding = "AI"

# D1 answer cache. Create with:
#   npx wrangler d1 create cerebrum-cache
# Then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "cerebrum-cache"
database_id = "dde9ab43-bb34-4c27-afc8-b79a53adbaaf"

# Shared rate-limit counter (functions/lib/rateLimit.js). Every endpoint used
# to hand-roll its own in-memory Map for this, which resets independently
# per isolate/colo — never a real global cap, just a per-edge one. The
# limiter needs storage genuinely shared across the whole edge, closing that
# gap. It used to be a KV namespace, but KV's free tier allows only 1,000
# writes/day and one write happens per rate-limited request, so normal
# traffic exhausted it in hours ("KV limit hit"). The counter now lives in
# the D1 database already bound above (rate_limits table, created on first
# use) — 100,000 rows written/day on the free tier, no new infrastructure.
# The KV namespace binding below was removed with the switch; the code falls
# back to the old per-isolate behavior when D1 isn't bound, so nothing
# breaks on a deployment without it.

# Automated Reports Queue Producer
[[queues.producers]]
queue = "cerebrum-reports"
binding = "REPORTS_QUEUE"
