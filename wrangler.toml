# compatibility_date pins which workerd runtime behavior this project builds
# against — Cloudflare only ever changes defaults for workers that opt in by
# bumping this, so an old date isn't a security problem, just a missed-out-on
# problem. Bumped from 2025-07-18 (over a year stale) to a more current date;
# picked one comfortably in the past rather than "today" so it's a version of
# workerd that's actually had time to prove itself in production.
name = "cerebrum"
compatibility_date = "2025-10-01"
pages_build_output_dir = "dist"

[ai]
binding = "AI"

# D1 answer cache. Create with:
#   npx wrangler d1 create cerebrum-cache
# Then paste the database_id below.
[[d1_databases]]
binding = "DB"
database_name = "cerebrum-cache"
database_id = "dde9ab43-bb34-4c27-afc8-b79a53adbaaf"

# Shared rate-limit counter (functions/lib/rateLimit.js). Every endpoint used
# to hand-roll its own in-memory Map for this, which resets independently
# per isolate/colo — never a real global cap, just a per-edge one. A KV
# namespace is genuinely shared across the whole edge, closing that gap.
# The code itself already tolerates this being absent (falls back to the old
# per-isolate behavior), but the placeholder ID below is NOT tolerated by a
# live deploy — Cloudflare validates that a [[kv_namespaces]] entry in this
# file resolves to a real namespace at publish time, and rejects the whole
# deploy (not just this binding) if it doesn't. A committed placeholder
# string here isn't "safe to add later," it's a hard deploy blocker the
# moment this file reaches Cloudflare, which is exactly what happened.
#
# Left commented out so deploys work again immediately with the safe
# per-isolate fallback. To turn on the real shared limiter:
#   1. npx wrangler kv namespace create RATE_LIMIT_KV
#      (run this from your own machine, logged into your own Cloudflare
#      account — this sandbox has no access to create it for you)
#   2. That command prints an `id = "...")` line — copy the actual hex id
#   3. Uncomment the three lines below and paste that id in place of the
#      placeholder, then commit and deploy again.
[[kv_namespaces]]
binding = "RATE_LIMIT_KV"
id = "b5732c572fe24442b01134d0887e4318"

# Automated Reports Queue Producer
[[queues.producers]]
queue = "cerebrum-reports"
binding = "REPORTS_QUEUE"
