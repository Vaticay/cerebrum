    <meta name="keywords" content="scientific literature search, research papers, PubMed, Europe PMC, OpenAlex, peer-reviewed, free research tool, academic search engine, science search" />
    <meta name="author" content="Cerebrum" />
    <meta name="publisher" content="Cerebrum" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="rating" content="general" />

    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://askcerebrum.org/" />

    <!-- Type system, loaded from the document head rather than injected by JS
         after mount (see src/main.jsx's now-removed loadFonts() IIFE) — a
         font stylesheet requested only after React has mounted and painted
         means the hero headline visibly swaps from its fallback (system
         sans) to Space Grotesk mid-render, a flash of unstyled text on
         every single first visit. Requesting it here starts the fetch
         before the JS bundle has even finished parsing.

         Loaded as a non-render-blocking stylesheet (the standard
         preload-then-swap trick: media="print" makes the browser fetch it
         at low priority without waiting on it, then onload flips it to
         "all" once it's actually ready) rather than a plain blocking
         <link rel="stylesheet">. A blocking stylesheet link in <head>
         delays every deferred/module script — including this whole app —
         until it resolves; on a network or browser extension that blocks
         Google Fonts, a plain blocking link means the entire app never
         renders at all, not just an unstyled headline. This way a slow or
         blocked font fetch costs a few seconds of fallback-font text,
         never a blank white screen. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" /></noscript>

    <meta name="twitter:title" content="Cerebrum — Free Scientific Literature Search" />
    <meta name="twitter:description" content="Ask a research question. Get cited answers from 14 open scholarly databases." />
    <meta name="twitter:image" content="https://askcerebrum.org/og-image.png" />

    <!-- Structured data: identifies Cerebrum as a legitimate WebSite + SearchAction
         in the Educational / Reference category. Reputation systems use this to
         categorize sites correctly instead of flagging them as unknown/suspicious. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cerebrum",
      "alternateName": "Ask Cerebrum",
      "url": "https://askcerebrum.org/",
      "description": "A free scientific literature search engine that queries 14 open scholarly databases and returns cited, verifiable answers.",
      "inLanguage": "en-US",
      "publisher": {
        "@type": "Organization",
        "name": "Cerebrum",
        "url": "https://askcerebrum.org/"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://askcerebrum.org/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Cerebrum",
      "url": "https://askcerebrum.org/",
      "applicationCategory": "EducationalApplication",
      "applicationSubCategory": "Scientific Literature Search",
      "operatingSystem": "Any (web-based)",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Cerebrum"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000000;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00e5a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 1.5s ease infinite"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1 0-4.12A2.5 2.5 0 0 1 7.5 11a2.5 2.5 0 0 1 0-4.12A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 0-4.12A2.5 2.5 0 0 0 16.5 11a2.5 2.5 0 0 0 0-4.12A2.5 2.5 0 0 0 14.5 2Z"/></svg></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style></div>
    <!-- Fallback content for crawlers and browsers with JS disabled. This is
         what non-JS reputation scanners and search engine crawlers actually
         index. Having real, descriptive content here — not just "loading..." —
         is one of the single most-effective ways to be categorized correctly. -->
    <noscript>
      <div style="max-width: 720px; margin: 40px auto; padding: 20px 24px; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #18181b;">
        <h1 style="font-size: 32px; font-weight: 700; letter-spacing: -0.02em;">Cerebrum</h1>
        <p><strong>Cerebrum is a free, all-in-one research platform — not just a chatbot.</strong> Ask a research question and receive cited answers assembled from 14 open scholarly databases including PubMed, Europe PMC, OpenAlex, Semantic Scholar, Crossref, arXiv, bioRxiv, DOAJ, PLOS, and Zenodo. Save sources into Collections, compare two investigations side by side, visualize how your sources relate to each other, and generate an illustrative figure for what you just learned.</p>
        <p>Every citation links to a real, verifiable paper. Cerebrum does not use ads and does not track users; an account is optional and only ever used to sync your saved research across devices.</p>
        <p>Cerebrum requires JavaScript to run. Please enable JavaScript in your browser to use the search.</p>
        <p>
          <a href="/about">About Cerebrum</a> &middot;
          <a href="/privacy">Privacy Policy</a> &middot;
          <a href="/terms">Terms of Service</a> &middot;
          <a href="/contact">Contact</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
