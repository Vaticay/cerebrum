    <!-- Type system, loaded from the document head rather than injected by JS
         after mount (see src/main.jsx's now-removed loadFonts() IIFE).
         A font stylesheet requested only after React has mounted and painted
         means the hero headline visibly swaps from its fallback (system
         sans) to Space Grotesk mid-render, a flash of unstyled text on
         every single first visit. Requesting it here starts the fetch
         before the JS bundle has even finished parsing.

         Loaded as a render-blocking stylesheet (preload + a plain
         <link rel="stylesheet">), not through the old non-render-blocking
         media="print" onload-swap trick: that trick needs an inline event
         handler, which a strict CSP must forbid, and it would have left the
         site permanently unstyled once the CSP shipped. Same-origin CSS
         blocks for a few milliseconds, not a network round trip, so the
         trick bought nothing here. A slow font fetch costs a few seconds
         of fallback-font text via font-display: swap, never a blank
         white screen. -->
    <!-- Fonts are served from this origin, not from Google.
         Previously three <link>s pointed at fonts.googleapis.com, which meant
         every visitor's IP address and User-Agent reached a third party
         before the page had rendered a single word, on a site whose whole
         proposition is that your research questions are private. The woff2
         files now live in /fonts (latin + latin-ext subsets only, ~700KB
         total) and the @font-face rules are local.

         The stylesheet is loaded normally rather than through the old
         media="print" onload="this.media='all'" trick: that trick needs an
         inline event handler, which a strict CSP must forbid, and it would
         have left the site permanently unstyled once the CSP shipped.
         Same-origin CSS blocks for a few milliseconds, not a network round
         trip, so the trick bought nothing here. -->
    <link rel="preload" as="style" href="/cerebrum-fonts.css" />
    <link rel="stylesheet" href="/cerebrum-fonts.css" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/NGSwv5HMAFg6IuGlBNMjxLsH8ag.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/NGSwv5HMAFg6IuGlBNMjxLsJ8ah8QA.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/fonts/orbitron-800.woff2" />

    <!-- Typeface, 2026-10-14 wave 1 foundation. Weights are 400 and 500 only per the 2026-10-14 wave 1 foundation. Inter is the UI face (stack below), Inter Tight is the self hosted face that guarantees it locally, and Source Serif 4 (self hosted, loaded by public/cerebrum-fonts.css) serves answer body and lesson text only. Inter Tight ships as a variable font from this origin /fonts directory. Two @font-face rules (latin and latin-ext subsets) with the real unicode ranges are declared here so the boot splash and first paint already use it, before React mounts. -->
    <style>
      /* 2026-10-20, owner photos and his order: these tokens are deliberately defined in three places because the single home arrangement of 2026-10-19 is what broke. The one home was served stale under an immutable cache rule and the UI font was undefined in production. The other two homes are public/cerebrum-fonts.css and the app :root block in src/CerebrumApp.jsx. Keep all three values identical. This HTML shell revalidates, so this copy cannot go stale the same way. */
      :root {
        --cb-display: 'Inter Tight', 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --cb-body: 'Inter Tight', 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        --cb-serif: 'Source Serif 4', Charter, 'Bitstream Charter', Georgia, 'Times New Roman', serif;
        --cb-mono: 'IBM Plex Mono', ui-monospace, 'SF Mono', SFMono-Regular, Menlo, Consolas, monospace;
        --cb-wordmark: 'Orbitron', 'Inter Tight', ui-sans-serif, system-ui, sans-serif;
        --cb-font: 'Inter Tight', 'Inter', ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      @font-face {
        font-family: 'Inter Tight';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/NGSwv5HMAFg6IuGlBNMjxLsJ8ah8QA.woff2') format('woff2');
        unicode-range: U+0020,U+0041,U+00A0,U+00C1,U+0100-0130,U+0132-0148,U+014A-0151,U+0154-01C3,U+01C5-02BA,U+02BC-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-0301,U+0303-0304,U+0308,U+0323,U+0329,U+1D43,U+1D47-1D49,U+1D4D,U+1D4F-1D50,U+1D52,U+1D56-1D58,U+1D5B,U+1D62-1D65,U+1D9C,U+1DA0,U+1DBB,U+1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20BF,U+2113,U+2C7C,U+2C7F,U+A7FF;
      }
      @font-face {
        font-family: 'Inter Tight';
        font-style: normal;
        font-weight: 100 900;
        font-display: swap;
        src: url('/fonts/NGSwv5HMAFg6IuGlBNMjxLsH8ag.woff2') format('woff2');
        unicode-range: U+0020-007E,U+00A0-00FF,U+0102,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0300-0301,U+0303-0304,U+0308,U+0323,U+0329,U+2002,U+2009,U+200B,U+2013-2014,U+2018-201A,U+201C-201E,U+2022,U+2026,U+2032-2033,U+2039-203A,U+2044,U+20AC,U+2122,U+2191,U+2193,U+2212,U+FEFF;
      }
    </style>

    <!-- Structured data: identifies Cerebrum as a legitimate WebSite + SearchAction
         in the Educational / Reference category. Reputation systems use this to
         categorize sites correctly instead of flagging them as unknown/suspicious. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cerebrum",
      "alternateName": "Ask Cerebrum",
      "url": "https://askcerebrum.org/",
      "description": "A scientific literature search engine that queries 14 open scholarly databases and returns answers whose citations link to real, checkable papers.",
      "inLanguage": "en-US",
      "publisher": {
        "@type": "Organization",
        "name": "Cerebrum",
        "url": "https://askcerebrum.org/",
        "logo": "https://askcerebrum.org/og-image.png?v=20261015b"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://askcerebrum.org/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json">

    <!-- Fallback content for crawlers and browsers with JS disabled. This is
         what non-JS reputation scanners and search engine crawlers actually
         index. Having real, descriptive content here, not just "loading...",
         is one of the single most-effective ways to be categorized correctly. -->
    <noscript>
      <div style="max-width: 720px; margin: 40px auto; padding: 20px 24px; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #18181b;">
        <h1 style="font-size: 32px; font-weight: 700; letter-spacing: -0.02em;">Cerebrum</h1>
        <!-- 2026-10-26 (AI feel purge): this fallback used to carry the
             same five paragraph boilerplate block that then repeated at
             the foot of every prerendered page. It now carries the
             door's own content: the headline the door shows, its entry
             point, and its specimen claims, verbatim from SPECIMENS in
             src/intro.jsx, with the papers they trace to. -->
        <p style="font-size: 24px; line-height: 1.35;">Ask a question and get an answer from the research papers, with the sources attached.</p>
        <p><a href="/">Start researching</a></p>
        <p>You ask a scientific question in plain language, no query syntax to learn. Cerebrum queries 14 open scholarly databases in parallel, including PubMed, Europe PMC, OpenAlex, Semantic Scholar, Crossref, arXiv, bioRxiv, DOAJ and PLOS, scores what comes back for relevance, and writes an answer from those papers. Every claim links to a paper you can open and check. If nothing relevant is found, Cerebrum says so instead of inventing sources. Answers are written by a language model, so they can still be wrong; the sources are there so you do not have to take the answer's word for anything.</p>
        <p>Claims the door shows, each traced to its paper:</p>
        <ul>
          <li>&ldquo;DNA is a double helix, with the two strands held together by paired bases.&rdquo; J. D. Watson &amp; F. H. C. Crick, &ldquo;Molecular structure of nucleic acids,&rdquo; Nature 171(4356), 1953. <a href="https://doi.org/10.1038/171737a0">Open the paper</a></li>
          <li>&ldquo;Ripples in spacetime from two colliding black holes reached Earth after traveling over a billion years.&rdquo; B. P. Abbott et al., &ldquo;Observation of gravitational waves from a binary black hole merger,&rdquo; Phys. Rev. Lett. 116(6), 2016. <a href="https://doi.org/10.1103/PhysRevLett.116.061102">Open the paper</a></li>
          <li>&ldquo;Stomach ulcers are caused by bacteria, not stress, and can be cured with antibiotics.&rdquo; B. J. Marshall &amp; J. R. Warren, &ldquo;Unidentified curved bacilli in the stomach of patients with gastritis and peptic ulceration,&rdquo; Lancet 323(8390), 1984. <a href="https://doi.org/10.1016/S0140-6736(84)91816-6">Open the paper</a></li>
          <li>&ldquo;A bacterial immune system can be reprogrammed to cut any chosen DNA sequence.&rdquo; M. Jinek et al., &ldquo;A programmable dual-RNA-guided DNA endonuclease in adaptive bacterial immunity,&rdquo; Science 337(6096), 2012. <a href="https://doi.org/10.1126/science.1225829">Open the paper</a></li>
          <li>&ldquo;About a third of patients improve on a sugar pill with no active ingredient.&rdquo; H. K. Beecher, &ldquo;The powerful placebo,&rdquo; J. Am. Med. Assoc. 159(17), 1955. <a href="https://doi.org/10.1001/jama.1955.02960340022006">Open the paper</a></li>
          <li>&ldquo;A Mediterranean diet with olive oil or nuts cut heart attacks and strokes by about 30 percent.&rdquo; R. Estruch et al., &ldquo;Primary prevention of cardiovascular disease with a Mediterranean diet,&rdquo; N. Engl. J. Med. 368, 2013. <a href="https://doi.org/10.1056/NEJMoa1200303">Open the paper</a></li>
        </ul>
        <p>Free, with no advertising and no sale of data. Searching and AI answers need no account, up to 50 AI answers every 5 days. An optional free account adds document reads and saved diagrams, and syncs your saved research, profiles, and messages. Preprints are labelled as preprints; not everything returned has been peer reviewed. What is stored, and for how long, is set out on the privacy page.</p>
        <p>Cerebrum requires JavaScript to run. Please enable JavaScript in your browser to use the search.</p>
