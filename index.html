<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>Cerebrum — Free Scientific Literature Search</title>
    <meta name="description" content="Ask a research question. Get answers assembled from 15 open scholarly databases including PubMed, Europe PMC, OpenAlex and Semantic Scholar, where every claim links to a paper you can open. Free, no ads, and an account is optional." />
    <meta name="keywords" content="scientific literature search, research papers, PubMed, Europe PMC, OpenAlex, peer-reviewed, free research tool, academic search engine, science search" />
    <meta name="author" content="Cerebrum" />
    <meta name="publisher" content="Cerebrum" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="rating" content="general" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#fafaf9" media="(prefers-color-scheme: light)" />
    <link rel="canonical" href="https://askcerebrum.org/" />

    <!-- Type system, loaded from the document head rather than injected by JS
         after mount (see src/main.jsx's now-removed loadFonts() IIFE) — a
         font stylesheet requested only after React has mounted and painted
         means the hero headline visibly swaps from its fallback (system
         sans) to Space Grotesk mid-render, a flash of unstyled text on
         every single first visit. Requesting it here starts the fetch
         before the JS bundle has even finished parsing.

         Loaded as a non-render-blocking stylesheet (the standard
         preload-then-swap trick: media="print" makes the browser fetch it
         at low priority without waiting on it, then onload flips it to
         "all" once it's actually ready) rather than a plain blocking
         <link rel="stylesheet">. A blocking stylesheet link in <head>
         delays every deferred/module script — including this whole app —
         until it resolves; on a network or browser extension that blocks
         Google Fonts, a plain blocking link means the entire app never
         renders at all, not just an unstyled headline. This way a slow or
         blocked font fetch costs a few seconds of fallback-font text,
         never a blank white screen. -->
    <!-- Fonts are served from this origin, not from Google.
         Previously three <link>s pointed at fonts.googleapis.com, which meant
         every visitor's IP address and User-Agent reached a third party
         before the page had rendered a single word — on a site whose whole
         proposition is that your research questions are private. The woff2
         files now live in /fonts (latin + latin-ext subsets only, ~700KB
         total) and the @font-face rules are local.

         The stylesheet is loaded normally rather than through the old
         media="print" onload="this.media='all'" trick: that trick needs an
         inline event handler, which a strict CSP must forbid, and it would
         have left the site permanently unstyled once the CSP shipped.
         Same-origin CSS blocks for a few milliseconds, not a network round
         trip, so the trick bought nothing here. -->
    <link rel="preload" as="style" href="/fonts/cerebrum-fonts.css" />
    <link rel="stylesheet" href="/fonts/cerebrum-fonts.css" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/favicon-32x32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->

    <meta property="og:title" content="Cerebrum — Free Scientific Literature Search" />

    <meta property="og:url" content="https://askcerebrum.org/" />
    <!-- ?v= cache-buster: bump it whenever public/og-image.png is redrawn,

    <meta property="og:image" content="https://askcerebrum.org/og-image.png?v=20260912" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Cerebrum — scientific literature search" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Cerebrum — Free Scientific Literature Search" />
    <meta name="twitter:description" content="Ask a research question. Get answers from 15 open scholarly databases, every claim linked to a real paper." />
    <meta name="twitter:image" content="https://askcerebrum.org/og-image.png?v=20260912" />

    <!-- Structured data: identifies Cerebrum as a legitimate WebSite + SearchAction
         in the Educational / Reference category. Reputation systems use this to
         categorize sites correctly instead of flagging them as unknown/suspicious. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Cerebrum",
      "alternateName": "Ask Cerebrum",
      "url": "https://askcerebrum.org/",
      "description": "A scientific literature search engine that queries 15 open scholarly databases and returns answers whose citations link to real, checkable papers.",
      "inLanguage": "en-US",
      "publisher": {
        "@type": "Organization",
        "name": "Cerebrum",
        "url": "https://askcerebrum.org/"
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://askcerebrum.org/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Cerebrum",
      "url": "https://askcerebrum.org/",
      "applicationCategory": "EducationalApplication",
      "applicationSubCategory": "Scientific Literature Search",
      "operatingSystem": "Any (web-based)",
      "browserRequirements": "Requires JavaScript. Requires HTML5.",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "creator": {
        "@type": "Organization",
        "name": "Cerebrum"
      }
    }
    </script>
  </head>
  <body>
    <div id="root"><div style="min-height:100vh;display:flex;align-items:center;justify-content:center;background:#000000;"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#00e5a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 1.5s ease infinite"><path d="M9.5 2A2.5 2.5 0 0 1 12 4.5v15a2.5 2.5 0 0 1-4.96-.44 2.5 2.5 0 0 1 0-4.12A2.5 2.5 0 0 1 7.5 11a2.5 2.5 0 0 1 0-4.12A2.5 2.5 0 0 1 9.5 2Z"/><path d="M14.5 2A2.5 2.5 0 0 0 12 4.5v15a2.5 2.5 0 0 0 4.96-.44 2.5 2.5 0 0 0 0-4.12A2.5 2.5 0 0 0 16.5 11a2.5 2.5 0 0 0 0-4.12A2.5 2.5 0 0 0 14.5 2Z"/></svg></div><style>@keyframes spin{to{transform:rotate(360deg)}}</style></div>
    <!-- Fallback content for crawlers and browsers with JS disabled. This is
         what non-JS reputation scanners and search engine crawlers actually
         index. Having real, descriptive content here — not just "loading..." —
         is one of the single most-effective ways to be categorized correctly. -->
    <noscript>
      <div style="max-width: 720px; margin: 40px auto; padding: 20px 24px; font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; line-height: 1.6; color: #18181b;">
        <h1 style="font-size: 32px; font-weight: 700; letter-spacing: -0.02em;">Cerebrum</h1>
        <p><strong>Cerebrum is a free research platform for scientific literature.</strong> Ask a research question and receive an answer assembled from 15 open scholarly databases including PubMed, Europe PMC, OpenAlex, Semantic Scholar, Crossref, arXiv, bioRxiv, DOAJ, PLOS and Zenodo. Save sources into collections, compare investigations side by side, and see how your sources relate to one another.</p>
        <p>Citations point to real papers you can open and check yourself. Answers are written by a language model from those papers, so they can still be wrong — the sources are there so you do not have to take our word for it. Preprints are labelled as preprints; not everything returned has been peer reviewed.</p>
        <p>Cerebrum carries no advertising and sells no data. An account is optional, and is used for saved research, profiles, and messaging other researchers. Questions classified as sensitive are never written to a shared cache. What is stored, and for how long, is set out on the privacy page.</p>
        <p>Cerebrum requires JavaScript to run. Please enable JavaScript in your browser to use the search.</p>
        <p>
          <a href="/about">About Cerebrum</a> &middot;
          <a href="/privacy">Privacy Policy</a> &middot;
          <a href="/terms">Terms of Service</a> &middot;
          <a href="/contact">Contact</a>
        </p>
      </div>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
