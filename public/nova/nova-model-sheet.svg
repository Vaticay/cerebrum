<!-- Nova model sheet REVISION 3. Front view only.
     Palette: skin #C97B63, blush #DD9A82, coat #FDF3D7, line #2A1A12, gold accent #A98A4C, bg #2E2A26.
     Stroke weights: heavy 10 (silhouette), thin 4 (interior), glasses 13. Flat fills only.
     Changes this round: head split from body into its own shape for rigging; left arm rebuilt as a
     continuous sleeve with cuff; floating white panel deleted; scalloped bib replaced with two flat
     notched lapel panels; hanging stem-and-dots replaced with a real placket band and buttons on it;
     glasses recolored sage to gold; Cerebrum ID badge rebuilt as a readable credential; added
     nostrils, blush, lens glare, cuffs, two pockets with monogram, toe lines, tail crease.
     Draw order is deliberate: Body sits behind Head_Base, Coat covers the neck join, the badge sits
     between the sleeve and the hand so the fingers read as gripping it. -->


