# Hourly "clock" for the Trending in Science feed.
#
# Cloudflare Pages Functions can't schedule themselves — Cron Triggers are
# a Workers-only feature, not something a Pages project can attach on its
# own. Rather than stand up and maintain a second Cloudflare project just
# to fetch a news feed once an hour, this workflow is the clock instead:
# it does nothing but call functions/api/trendingrefresh.js once an hour,
# and that endpoint does the actual work (fetch real articles, refresh the
# D1 cache that functions/api/trending.js serves to visitors).
#
# Requires one repo secret: TRENDING_REFRESH_SECRET. Set it to the exact
# same value in two places:
#   1. GitHub: this repo's Settings -> Secrets and variables -> Actions ->
#      New repository secret -> name it TRENDING_REFRESH_SECRET.
#   2. Cloudflare Pages: this project's Settings -> Environment variables ->
#      add TRENDING_REFRESH_SECRET (as a secret, for the Production
#      environment) with that same value.
# Without both sides matching, the refresh call gets a 401 and the feed
# just keeps serving whatever it last had cached — it fails safe, never
# fails loud in a way a visitor would notice.

name: Refresh trending feed

on:
  schedule:
    # Standard 5-field cron, UTC only — GitHub does not support any other
    # timezone for scheduled workflows. Runs at the top of every hour.
    # GitHub explicitly documents that scheduled workflows can be delayed
    # by a few minutes during periods of high load on their end; this
    # endpoint's own cache-staleness check (90 minutes) gives that plenty
    # of headroom.
    - cron: "0 * * * *"
  # Lets anyone with write access trigger a refresh on demand from the
  # Actions tab, without waiting for the next hour — handy right after
  # first setting the secret, or after changing the source feed logic.
  workflow_dispatch: {}

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Was `curl --fail --silent --show-error`, which fails the job with
      # exit code 22 and tells you nothing else — the status code and the
      # server's own error message are both discarded. "Process completed
      # with exit code 22" is not a diagnosis, and every one of the possible
      # causes here needs a different fix:
      #
      #   401  the secret is missing or doesn't match on the Cloudflare side
      #   404/405 or an HTML body  the Function isn't deployed at that path
      #   429  rate limited, harmless, will pass on the next run
      #   5xx  the endpoint itself broke
      #
      # This prints the status and the body, then decides. It also treats a
      # missing GitHub secret as a clear message rather than sending an
      # empty bearer token and reporting a confusing 401.
      - name: Call trendingrefresh endpoint
        env:
          SECRET: ${{ secrets.TRENDING_REFRESH_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "${SECRET}" ]; then
            echo "::error::The GitHub secret TRENDING_REFRESH_SECRET is not set."
            echo "Add it under Settings > Secrets and variables > Actions,"
            echo "and set a variable of the same name to the SAME value in"
            echo "Cloudflare Pages > Settings > Variables and Secrets."
            exit 1
          fi

          BODY_FILE="$(mktemp)"
          STATUS="$(curl --silent --show-error \
            --output "${BODY_FILE}" --write-out '%{http_code}' \
            -X POST "https://askcerebrum.org/api/trendingrefresh" \
            -H "Authorization: Bearer ${SECRET}")"

          echo "HTTP ${STATUS}"
          echo "--- response body ---"
          head -c 600 "${BODY_FILE}" || true
          echo
          echo "---------------------"

          case "${STATUS}" in
            2*)
              echo "Trending feed refreshed."
              ;;
            401)
              echo "::error::401 Unauthorized. TRENDING_REFRESH_SECRET does not match the value set in Cloudflare Pages (or is not set there yet, or Cloudflare has not been redeployed since it was added). The two values must be byte-identical - a trailing space on one of the pastes is the usual cause."
              exit 1
              ;;
            404|405)
              echo "::error::HTTP ${STATUS}. Nothing is serving /api/trendingrefresh, so Cloudflare fell back to the static site. Check that functions/api/trendingrefresh.js exists in the repo, spelled exactly like that, and that the deploy succeeded."
              exit 1
              ;;
            429)
              echo "::warning::Rate limited. Not a failure - the next hourly run will go through."
              ;;
            *)
              if head -c 200 "${BODY_FILE}" | grep -qi "<!doctype html\|<html"; then
                echo "::error::The endpoint returned a web page instead of JSON, which means functions/api/trendingrefresh.js is not deployed at that path."
              else
                echo "::error::Refresh failed with HTTP ${STATUS}. See the response body above."
              fi
              exit 1
              ;;
          esac
